<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Crop Service</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #dfe3e8; --text: #1c2430; --muted: #5f6b7a;
    --accent: #2f6fde; --accent-text: #ffffff; --danger: #c93b3b; --ok: #1f8a4c; --warn: #b26b00;
    --shade: rgba(10, 14, 20, 0.62); --frame: #ffd23f; --track: #e8ebef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --surface: #1b2027; --border: #2d343e; --text: #e6e9ee; --muted: #9aa5b3;
      --accent: #5b92f0; --accent-text: #0d1117; --danger: #ef6b6b; --ok: #4cc17f; --warn: #e0a640;
      --shade: rgba(0, 0, 0, 0.7); --track: #2a313b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  a { color: var(--accent); }
  .pill { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: currentColor; } .pill.bad { color: var(--danger); border-color: currentColor; }
  .grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=number] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; }
  select { flex: 1; min-width: 0; }
  button { font: inherit; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .drop { display: block; border: 2px dashed var(--border); border-radius: 8px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 12px; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .muted { color: var(--muted); font-size: 13px; }
  .stage-wrap { margin-top: 12px; display: flex; justify-content: center; background: #000; border-radius: 8px; overflow: hidden; min-height: 120px; align-items: center; }
  .stage { position: relative; display: inline-block; max-width: 100%; line-height: 0; }
  .stage video { display: block; max-width: 100%; max-height: 440px; }
  .stage .placeholder { width: min(640px, 80vw); background: repeating-linear-gradient(45deg, #222, #222 10px, #2a2a2a 10px, #2a2a2a 20px); }
  .shade { position: absolute; background: var(--shade); pointer-events: none; }
  .frame { position: absolute; outline: 2px solid var(--frame); pointer-events: none; }
  .crop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .crop-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .crop-grid input { width: 100%; }
  .result-size { font-size: 18px; font-weight: 600; margin: 4px 0 2px; }
  .hint { min-height: 20px; font-size: 13px; }
  .hint.bad { color: var(--danger); } .hint.good { color: var(--ok); }
  .error { color: var(--danger); font-size: 14px; margin-top: 8px; white-space: pre-wrap; }
  .jobs { list-style: none; margin: 0; padding: 0; }
  .job { border-top: 1px solid var(--border); padding: 10px 0; }
  .job:first-child { border-top: 0; }
  .job .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .job .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .s-pending { color: var(--muted); } .s-processing { color: var(--accent); } .s-completed { color: var(--ok); }
  .s-failed { color: var(--danger); } .s-cancelled { color: var(--warn); }
  .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .bar.indeterminate > div { width: 30% !important; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .job .actions { display: flex; gap: 6px; margin-top: 6px; }
  .job .actions button { padding: 4px 10px; font-size: 13px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
  .compare figure { margin: 0; }
  .compare video { width: 100%; max-height: 360px; background: #000; border-radius: 6px; }
  .compare figcaption { font-size: 13px; color: var(--muted); margin-top: 4px; }
  #result { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Video Crop Service</h1>
    <div class="row"><a href="/docs" class="muted">API docs</a><span id="health" class="pill">checking…</span></div>
  </header>

  <div class="grid">
    <section class="card">
      <h2>1 · Source video</h2>
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".mp4,.mov,.m4v,.mkv,.webm,.avi" hidden>
        <span id="dropText">Drop a video here or click to upload (mp4, mov, m4v, mkv, webm, avi)</span>
      </label>
      <div class="row">
        <select id="sourceSelect"><option value="">Or choose a video already uploaded…</option></select>
      </div>
      <div id="sourceInfo" class="muted" style="margin-top:8px"></div>
      <div class="stage-wrap" id="stageWrap" hidden>
        <div class="stage" id="stage">
          <video id="preview" muted playsinline controls></video>
          <div class="shade" id="shT"></div><div class="shade" id="shB"></div>
          <div class="shade" id="shL"></div><div class="shade" id="shR"></div>
          <div class="frame" id="frame"></div>
        </div>
      </div>
      <div id="sourceError" class="error"></div>
    </section>

    <section class="card">
      <h2>2 · Crop (pixels to remove)</h2>
      <div class="crop-grid">
        <label>Top <input type="number" id="top" min="0" step="2" value="0"></label>
        <label>Bottom <input type="number" id="bottom" min="0" step="2" value="0"></label>
        <label>Left <input type="number" id="left" min="0" step="2" value="0"></label>
        <label>Right <input type="number" id="right" min="0" step="2" value="0"></label>
      </div>
      <div class="muted">Output size</div>
      <div class="result-size" id="resultSize">–</div>
      <div class="hint" id="hint"></div>
      <button class="primary" id="submit" disabled>Crop video</button>
      <div id="submitError" class="error"></div>
    </section>
  </div>

  <section class="card" id="result">
    <h2>Result</h2>
    <div class="compare">
      <figure><video id="origVideo" controls muted playsinline></video><figcaption id="origCap"></figcaption></figure>
      <figure><video id="outVideo" controls muted playsinline></video><figcaption id="outCap"></figcaption></figure>
    </div>
    <div class="row" style="margin-top:10px"><a id="download" download><button>Download cropped MP4</button></a></div>
  </section>

  <section class="card">
    <h2>3 · Jobs</h2>
    <ul class="jobs" id="jobs"><li class="muted">No jobs yet.</li></ul>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const sides = ["top", "bottom", "left", "right"];
const MIN = 16;
let source = null; // { name, width, height, durationSeconds, sizeBytes }
let shownResult = null;
let pollTimer = null;

async function api(path, options = {}) {
  const res = await fetch(path, options);
  const body = res.headers.get("content-type")?.includes("json") ? await res.json() : null;
  if (!res.ok) {
    const err = body?.error;
    const details = err?.details?.map((d) => `${d.field}: ${d.message}`).join("\n");
    throw new Error(err ? `${err.message}${details ? "\n" + details : ""}` : `HTTP ${res.status}`);
  }
  return body;
}

const fmtBytes = (n) => n > 1e9 ? (n / 1e9).toFixed(2) + " GB" : n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " KB";
const fmtSecs = (s) => s == null ? "unknown length" : s >= 60 ? `${Math.floor(s / 60)}m ${Math.round(s % 60)}s` : `${s.toFixed(1)}s`;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// --- health -------------------------------------------------------------------
api("/healthz").then((h) => {
  $("health").textContent = h.status === "ok" ? "ffmpeg ready" : "ffmpeg missing";
  $("health").className = "pill " + (h.status === "ok" ? "ok" : "bad");
}).catch(() => { $("health").textContent = "API unreachable"; $("health").className = "pill bad"; });

// --- sources ------------------------------------------------------------------
async function loadSources(selectName) {
  const { items } = await api("/v1/sources");
  const sel = $("sourceSelect");
  sel.innerHTML = '<option value="">Or choose a video already uploaded…</option>' +
    items.map((s) => `<option value="${esc(s.name)}">${esc(s.name)} (${fmtBytes(s.sizeBytes)})</option>`).join("");
  if (selectName) sel.value = selectName;
}

async function selectSource(name) {
  $("sourceError").textContent = "";
  if (!name) { source = null; $("stageWrap").hidden = true; $("sourceInfo").textContent = ""; updateCrop(); return; }
  try {
    source = await api(`/v1/sources/${encodeURIComponent(name)}`);
  } catch (e) {
    source = null; $("stageWrap").hidden = true; $("sourceError").textContent = e.message; updateCrop(); return;
  }
  $("sourceInfo").textContent = `${source.width}×${source.height} · ${fmtSecs(source.durationSeconds)} · ${fmtBytes(source.sizeBytes)}`;
  const stage = $("stage");
  stage.querySelector(".placeholder")?.remove();
  const video = $("preview");
  video.hidden = false;
  video.src = `/v1/sources/${encodeURIComponent(name)}/content`;
  $("stageWrap").hidden = false;
  updateCrop();
}

$("preview").addEventListener("error", () => {
  // Browser can't decode this container (e.g. AVI): keep the crop overlay on a placeholder of the right shape.
  if (!source) return;
  $("preview").hidden = true;
  const ph = document.createElement("div");
  ph.className = "placeholder";
  ph.style.aspectRatio = `${source.width} / ${source.height}`;
  $("stage").prepend(ph);
  $("sourceInfo").textContent += " · preview not supported in this browser, cropping still works";
});

$("sourceSelect").addEventListener("change", (e) => selectSource(e.target.value));

function upload(file) {
  $("sourceError").textContent = "";
  const form = new FormData();
  form.append("file", file);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/v1/sources");
  xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("dropText").textContent = `Uploading ${file.name}… ${Math.round(e.loaded / e.total * 100)}%`; };
  xhr.onload = async () => {
    $("dropText").textContent = "Drop a video here or click to upload (mp4, mov, m4v, mkv, webm, avi)";
    let body = null; try { body = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 201) { $("sourceError").textContent = body?.error?.message || `Upload failed (HTTP ${xhr.status})`; return; }
    await loadSources(body.name);
    selectSource(body.name);
  };
  xhr.onerror = () => { $("sourceError").textContent = "Upload failed: network error"; };
  xhr.send(form);
}

$("file").addEventListener("change", (e) => { if (e.target.files[0]) upload(e.target.files[0]); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); });

// --- crop -------------------------------------------------------------------------
const cropValues = () => Object.fromEntries(sides.map((s) => [s, Number($(s).value)]));

function updateCrop() {
  const c = cropValues();
  const hint = $("hint");
  let ok = false;
  if (!source) {
    $("resultSize").textContent = "–"; hint.textContent = "Choose a source video first."; hint.className = "hint";
  } else {
    const w = source.width - c.left - c.right, h = source.height - c.top - c.bottom;
    $("resultSize").textContent = `${source.width}×${source.height} → ${w}×${h}`;
    const invalid = sides.find((s) => !Number.isInteger(c[s]) || c[s] < 0);
    if (invalid) hint.textContent = `${invalid} must be a whole number ≥ 0`;
    else if (!sides.some((s) => c[s] > 0)) hint.textContent = "Enter at least one value to crop.";
    else if (w < MIN || h < MIN) hint.textContent = `Too much cropped: result must be at least ${MIN}×${MIN}.`;
    else if (w % 2 || h % 2) hint.textContent = "Width and height of the result must be even (H.264).";
    else { hint.textContent = "Looks good."; ok = true; }
    hint.className = "hint " + (ok ? "good" : "bad");
    drawOverlay(c);
  }
  // The server validates too; client checks are only for instant feedback.
  $("submit").disabled = !source;
}

function drawOverlay(c) {
  const pct = (v, total) => `${Math.max(0, Math.min(100, (v / total) * 100))}%`;
  const W = source.width, H = source.height;
  Object.assign($("shT").style, { left: 0, right: 0, top: 0, height: pct(c.top, H) });
  Object.assign($("shB").style, { left: 0, right: 0, bottom: 0, height: pct(c.bottom, H) });
  Object.assign($("shL").style, { left: 0, top: pct(c.top, H), bottom: pct(c.bottom, H), width: pct(c.left, W) });
  Object.assign($("shR").style, { right: 0, top: pct(c.top, H), bottom: pct(c.bottom, H), width: pct(c.right, W) });
  Object.assign($("frame").style, { left: pct(c.left, W), right: pct(c.right, W), top: pct(c.top, H), bottom: pct(c.bottom, H) });
}

sides.forEach((s) => $(s).addEventListener("input", updateCrop));

$("submit").addEventListener("click", async () => {
  $("submitError").textContent = "";
  $("submit").disabled = true;
  try {
    // A fresh key per click: a double-click or network retry can't create duplicate jobs.
    await api("/v1/crop-jobs", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Idempotency-Key": crypto.randomUUID() },
      body: JSON.stringify({ sourceVideo: source.name, crop: cropValues() }),
    });
    refreshJobs();
  } catch (e) {
    $("submitError").textContent = e.message;
  } finally {
    $("submit").disabled = !source;
  }
});

// --- jobs ---------------------------------------------------------------------------
let jobsById = {};

function renderJob(j) {
  const c = j.crop;
  const active = j.status === "pending" || j.status === "processing";
  const unknown = j.status === "processing" && j.progress == null;
  const progress = j.status === "completed" ? 100 : (j.progress ?? 0);
  const retry = j.status === "pending" && j.attempts > 0 ? ` · retrying (attempt ${j.attempts + 1}/${j.maxAttempts})` : "";
  return `<li class="job">
    <div class="top"><span class="name">${esc(j.sourceVideo)}</span><span class="badge s-${j.status}">${j.status}${j.cancelRequested && active ? " · cancelling" : ""}</span></div>
    <div class="muted">${j.source.width}×${j.source.height} → ${j.output.width}×${j.output.height} · crop t${c.top} b${c.bottom} l${c.left} r${c.right}${retry}</div>
    ${active ? `<div class="bar ${unknown ? "indeterminate" : ""}"><div style="width:${progress}%"></div></div>
      <div class="muted">${unknown ? "Processing (length unknown)…" : `${Math.round(progress)}%`}</div>` : ""}
    ${j.error && !active ? `<div class="error">${esc(j.error.code)}: ${esc(j.error.message)}</div>` : ""}
    ${j.status === "completed" && !j.output.available ? `<div class="muted">Output expired</div>` : ""}
    <div class="actions">
      ${active && !j.cancelRequested ? `<button data-cancel="${j.id}">Cancel</button>` : ""}
      ${j.output.available ? `<button data-show="${j.id}">Preview</button><a href="${j.output.url}" download><button>Download</button></a>` : ""}
    </div>
  </li>`;
}

async function refreshJobs() {
  clearTimeout(pollTimer);
  try {
    const { items } = await api("/v1/crop-jobs?limit=20");
    const before = jobsById;
    jobsById = Object.fromEntries(items.map((j) => [j.id, j]));
    $("jobs").innerHTML = items.length ? items.map(renderJob).join("") : '<li class="muted">No jobs yet.</li>';
    // Open the result automatically when a job finishes while the page is watching it.
    const justDone = items.find((j) => j.status === "completed" && j.output.available && before[j.id] && before[j.id].status !== "completed");
    if (justDone) showResult(justDone);
    const anyActive = items.some((j) => j.status === "pending" || j.status === "processing");
    pollTimer = setTimeout(refreshJobs, anyActive ? 1000 : 5000);
  } catch {
    pollTimer = setTimeout(refreshJobs, 3000);
  }
}

$("jobs").addEventListener("click", async (e) => {
  const cancel = e.target.closest("[data-cancel]");
  const show = e.target.closest("[data-show]");
  if (cancel) {
    cancel.disabled = true;
    try { await api(`/v1/crop-jobs/${cancel.dataset.cancel}/cancel`, { method: "POST" }); } catch (err) { alert(err.message); }
    refreshJobs();
  } else if (show) {
    showResult(jobsById[show.dataset.show]);
  }
});

function showResult(j) {
  if (shownResult === j.id) return;
  shownResult = j.id;
  $("result").style.display = "block";
  $("origVideo").src = `/v1/sources/${encodeURIComponent(j.sourceVideo)}/content`;
  $("outVideo").src = j.output.url;
  $("origCap").textContent = `Original · ${j.source.width}×${j.source.height}`;
  $("outCap").textContent = `Cropped · ${j.output.width}×${j.output.height}${j.output.sizeBytes ? " · " + fmtBytes(j.output.sizeBytes) : ""}`;
  $("download").href = j.output.url;
  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

loadSources().catch((e) => { $("sourceError").textContent = e.message; });
updateCrop();
refreshJobs();
</script>
</body>
</html>
